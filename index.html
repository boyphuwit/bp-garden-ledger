<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BP garden">
<title>BP garden — รายรับรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f3f5ef; --card:#ffffff; --ink:#1f2a1f; --muted:#6b7a6a; --line:#e2e7dc;
    --green:#2f6b3a; --green-2:#3f8a4c; --green-soft:#e6f0e3;
    --in:#2f8a4a; --in-soft:#e3f3e6; --out:#c4532f; --out-soft:#fbe9e2;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:16px}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  header{background:linear-gradient(135deg,#24552e,#3f8a4c);color:#fff;padding:18px 0 22px;border-radius:0 0 22px 22px;margin-bottom:14px}
  header .wrap{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
  header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  header p{margin:2px 0 0;font-size:13px;opacity:.85}
  .sync{margin-left:auto;font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,50,30,.06)}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:600}
  .seg{display:flex;background:#eef1ea;border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .seg.type button.on[data-v="in"]{background:var(--in);color:#fff}
  .seg.type button.on[data-v="out"]{background:var(--out);color:#fff}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fbfcf9;color:var(--ink);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--green-2);background:#fff}
  .amount{font-size:28px;font-weight:700;text-align:right;padding:14px}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--green-soft);border-color:var(--green-2);color:var(--green);font-weight:600}
  .btn{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--green);cursor:pointer;margin-top:16px}
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:#eef1ea;color:var(--ink);font-weight:600;font-size:15px;padding:12px;margin-top:8px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{border-radius:14px;padding:12px 14px}
  .kpi small{display:block;font-size:12px;color:var(--muted)}
  .kpi b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
  .kpi.in{background:var(--in-soft)} .kpi.in b{color:var(--in)}
  .kpi.out{background:var(--out-soft)} .kpi.out b{color:var(--out)}
  .kpi.net{grid-column:1/-1;background:#f1f4ec;display:flex;justify-content:space-between;align-items:center}
  .kpi.net b{font-size:24px}
  .list{list-style:none;margin:0;padding:0}
  .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:0}
  .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;flex:none;font-size:18px}
  .dot.in{background:var(--in-soft);color:var(--in)} .dot.out{background:var(--out-soft);color:var(--out)}
  .item .t{flex:1;min-width:0}
  .item .t div{font-weight:600;font-size:15px}
  .item .t small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .a.in{color:var(--in)} .a.out{color:var(--out)}
  .dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:14px 2px 4px;border-bottom:1px solid var(--line)}
  .empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}
  .bars .b{margin:10px 0}
  .bars .b .l{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
  .bars .b .track{height:9px;background:#eef1ea;border-radius:99px;overflow:hidden}
  .bars .b .fill{height:100%;border-radius:99px}
  .chartbox{position:relative;height:240px}
  nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
  nav .wrap{display:flex}
  nav button{flex:1;border:0;background:none;padding:10px 4px 9px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav button svg{width:23px;height:23px}
  nav button.on{color:var(--green);font-weight:600}
  .view{display:none}.view.on{display:block}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#1f2a1f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .modal{position:fixed;inset:0;background:rgba(20,30,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h3{margin:0 0 6px;font-size:17px}
  .sheet p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .danger{background:var(--out)}
  .editbar{display:none;background:#fff7e0;border:1px solid #f1d98a;color:#7a5a00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;align-items:center;justify-content:space-between}
  .editbar.on{display:flex}
  .editbar button{border:0;background:none;color:#7a5a00;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
  .muted{color:var(--muted);font-size:13px}
  .note{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 0 16px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V11"/><path d="M12 11C12 6 8 3 4 3c0 5 3 8 8 8z"/><path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/></svg>
    </div>
    <div>
      <h1>BP garden</h1>
      <p>บันทึกรายรับ–รายจ่าย</p>
    </div>
    <span class="sync" id="sync">กำลังเชื่อมต่อ…</span>
  </div>
</header>

<main class="wrap">
  <!-- ADD -->
  <section class="view on" id="v-add">
    <div class="editbar" id="editbar"><span>กำลังแก้ไขรายการ</span><button id="cancelEdit">ยกเลิก</button></div>
    <div class="card">
      <div class="seg type" id="typeSeg">
        <button data-v="in" class="on">＋ รายรับ</button>
        <button data-v="out">－ รายจ่าย</button>
      </div>
      <label for="amt">จำนวนเงิน (บาท)</label>
      <input id="amt" class="amount" inputmode="decimal" placeholder="0" autocomplete="off">
      <label>หมวดหมู่</label>
      <div class="chips" id="cats"></div>
      <div class="row">
        <div>
          <label for="date">วันที่</label>
          <input id="date" type="date">
        </div>
        <div>
          <label for="pay">ช่องทาง</label>
          <select id="pay"><option>เงินสด</option><option>โอน/QR</option><option>บัตร</option></select>
        </div>
      </div>
      <label for="note">หมายเหตุ</label>
      <input id="note" placeholder="เช่น สนเกรวิเลียแดงเม่น 1 ต้น" autocomplete="off">
      <button class="btn" id="saveBtn">บันทึก</button>
    </div>

    <div class="card">
      <h2 id="todayTitle">วันนี้</h2>
      <div class="kpis" id="todayKpis"></div>
      <ul class="list" id="todayList" style="margin-top:8px"></ul>
    </div>
  </section>

  <!-- SUMMARY -->
  <section class="view" id="v-sum">
    <div class="card">
      <div class="seg" id="periodSeg">
        <button data-v="day" class="on">รายวัน</button>
        <button data-v="month">รายเดือน</button>
        <button data-v="year">รายปี</button>
      </div>
      <div id="pickerBox" style="margin-top:12px"></div>
    </div>
    <div class="card">
      <h2 id="sumTitle">สรุป</h2>
      <div class="kpis" id="sumKpis"></div>
    </div>
    <div class="card">
      <h2 id="chartTitle">กราฟ</h2>
      <div class="chartbox"><canvas id="chart"></canvas></div>
      <p class="muted" id="chartHint" style="margin:8px 0 0;text-align:center">แตะแท่งกราฟเพื่อดูช่วงนั้น</p>
    </div>
    <div class="card">
      <h2>รายรับตามหมวด</h2>
      <div class="bars" id="catIn"></div>
    </div>
    <div class="card">
      <h2>รายจ่ายตามหมวด</h2>
      <div class="bars" id="catOut"></div>
    </div>
  </section>

  <!-- LIST -->
  <section class="view" id="v-list">
    <div class="card">
      <div class="row">
        <div><label for="listMonth" style="margin-top:0">เดือน</label><input id="listMonth" type="month"></div>
        <div><label for="listType" style="margin-top:0">ประเภท</label>
          <select id="listType"><option value="all">ทั้งหมด</option><option value="in">รายรับ</option><option value="out">รายจ่าย</option></select></div>
      </div>
      <input id="listSearch" placeholder="ค้นหาหมายเหตุ / หมวด" style="margin-top:10px" autocomplete="off">
    </div>
    <div class="card">
      <div class="kpis" id="listKpis"></div>
      <div id="listBody"></div>
      <button class="btn ghost" id="copyCsv">คัดลอกข้อมูลเดือนนี้ (CSV) ไปวางใน Excel/Sheets</button>
    </div>
    <div class="card">
      <h2>สำรอง / กู้คืนข้อมูล</h2>
      <p class="muted" style="margin:0 0 6px">ข้อมูลเก็บในเครื่องนี้ ควรกดสำรองเก็บไว้เป็นระยะ หรือใช้ย้ายข้อมูลไปเครื่องอื่น</p>
      <button class="btn ghost" id="backupBtn">⬇ ดาวน์โหลดไฟล์สำรอง (.json)</button>
      <button class="btn ghost" id="restoreBtn">⬆ กู้คืนจากไฟล์สำรอง</button>
      <input type="file" id="restoreFile" accept=".json,application/json" style="display:none">
    </div>
  </section>
  <p class="note" id="storeNote"></p>
</main>

<nav>
  <div class="wrap">
    <button data-v="add" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>บันทึก</button>
    <button data-v="sum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>สรุป/กราฟ</button>
    <button data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>รายการ</button>
  </div>
</nav>

<div class="toast" id="toast"></div>
<div class="modal" id="modal">
  <div class="sheet">
    <h3 id="mTitle">รายการ</h3>
    <p id="mBody"></p>
    <button class="btn" id="mEdit">แก้ไข</button>
    <button class="btn danger" id="mDel" style="margin-top:8px">ลบรายการนี้</button>
    <button class="btn ghost" id="mClose">ปิด</button>
  </div>
</div>

<script>
(function(){
  const CATS = {
    in: ["ขายไม้ล้อม","ขายต้นไม้กระถาง","ขายกระถาง","ขายดิน/วัสดุปลูก","ค่าปลูก/จัดสวน","ค่าส่ง","ดูแลสวน","ระบบฟาร์มอัจฉริยะ","อื่นๆ"],
    out:["ซื้อต้นไม้เข้าร้าน","ซื้อกระถาง/ดิน","ค่าเช่าที่","ค่าแรง","ค่าน้ำมัน/ขนส่ง","ค่าน้ำ/ไฟ","ปุ๋ย/ยา/อุปกรณ์","โฆษณา/การตลาด","อื่นๆ"]
  };
  const TH_M = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
  const TH_MF = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
  const $ = s => document.querySelector(s);
  const pad = n => String(n).padStart(2,"0");
  const todayStr = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
  const fmt = n => (Math.round(n*100)/100).toLocaleString("th-TH",{maximumFractionDigits:2});
  const be = y => Number(y)+543;
  const dateTH = s => { const [y,m,d]=s.split("-"); return Number(d)+" "+TH_M[Number(m)-1]+" "+String(be(y)).slice(2); };
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- state ----------
  let entries = {};            // id -> entry
  let mode = "local";          // "db" | "local"
  let db = null;
  let type = "in", cat = CATS.in[0], editing = null;
  let period = "day", selDay = todayStr(), selMonth = todayStr().slice(0,7), selYear = todayStr().slice(0,4);
  let chart = null, chartKeys = [];

  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2000); }
  function setSync(txt){ $("#sync").textContent = txt; }

  // ---------- storage: local fallback ----------
  const LS_KEY = "bpgarden-ledger-v1";
  function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); entries = raw?JSON.parse(raw):{}; }catch(e){ entries={}; } }
  function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(entries)); }catch(e){} }

  // ---------- storage: db (one doc per month: months/YYYY-MM {items:{id:entry|null}}) ----------
  let queue = Promise.resolve();
  function enqueue(fn){ queue = queue.then(fn, fn); return queue; }
  async function dbPut(monthKey, id, value){
    const ref = db.doc("months/"+monthKey);
    try { await ref.update({items:{[id]:value}}); }
    catch(e){
      if (e && e.code==="invalid_argument" && value!==null){ await ref.set({items:{[id]:value}}); }
      else if (e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*600)); await ref.update({items:{[id]:value}}); }
      else if (!(e && e.code==="invalid_argument" && value===null)) throw e;
    }
  }

  async function saveEntry(entry, oldEntry){
    entries[entry.id] = entry;
    renderAll();
    if (mode==="local"){ saveLocal(); return; }
    return enqueue(async()=>{
      if (oldEntry && oldEntry.date.slice(0,7)!==entry.date.slice(0,7)) await dbPut(oldEntry.date.slice(0,7), entry.id, null);
      await dbPut(entry.date.slice(0,7), entry.id, entry);
    }).catch(e=>{ handleWriteErr(e); });
  }
  async function deleteEntry(e){
    delete entries[e.id]; renderAll();
    if (mode==="local"){ saveLocal(); return; }
    return enqueue(()=>dbPut(e.date.slice(0,7), e.id, null)).catch(handleWriteErr);
  }
  function handleWriteErr(e){
    const c = e && e.code;
    if (c==="quota_exceeded") toast("พื้นที่เก็บข้อมูลเต็ม บันทึกไม่สำเร็จ");
    else if (c==="invalid_argument") { toast("บัญชีนี้ไม่มีสิทธิ์บันทึก (ดูได้อย่างเดียว)"); }
    else toast("บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง");
  }

  async function initDb(){
    let resolved = false;
    const fallbackTimer = setTimeout(()=>{ if(!resolved){ setSync("บันทึกในเครื่อง"); } }, 10000);
    let ns = null;
    try{ ns = window.claude && typeof window.claude.use==="function" ? await window.claude.use("db") : null; }catch(e){ ns=null; }
    resolved = true; clearTimeout(fallbackTimer);
    if (!ns){
      mode="local"; setSync("บันทึกในเครื่อง");
      $("#storeNote").textContent = "ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้ — สำรองได้ที่หน้า รายการ";
      return;
    }
    db = ns; mode = "db";
    $("#storeNote").textContent = "ข้อมูลซิงก์อัตโนมัติทุกเครื่องที่เปิดลิงก์นี้";
    const loadTimer = setTimeout(()=>setSync("ยังเชื่อมต่อไม่ได้"), 10000);
    db.collection("months").onSnapshot(snap=>{
      if (!snap.metadata.fromCache) { clearTimeout(loadTimer); setSync("ซิงก์แล้ว ✓"); }
      const next = {};
      snap.docs.forEach(d=>{
        const items = (d.data()||{}).items || {};
        for (const k in items){ const v=items[k]; if (v && typeof v==="object" && v.id && v.date) next[k] = Object.assign({}, v); }
      });
      entries = next; renderAll();
    }, err=>{ clearTimeout(loadTimer); setSync("ออฟไลน์"); toast("เชื่อมต่อข้อมูลไม่ได้"); });
  }

  // ---------- helpers ----------
  const list = () => Object.values(entries);
  function sumOf(arr){ let i=0,o=0; arr.forEach(e=>{ if(e.type==="in") i+=e.amount; else o+=e.amount; }); return {i,o,n:i-o}; }
  function kpiHtml(s){
    return `<div class="kpi in"><small>รายรับ</small><b>฿${fmt(s.i)}</b></div>
            <div class="kpi out"><small>รายจ่าย</small><b>฿${fmt(s.o)}</b></div>
            <div class="kpi net"><small>กำไรสุทธิ</small><b style="color:${s.n>=0?"var(--in)":"var(--out)"}">${s.n<0?"-":""}฿${fmt(Math.abs(s.n))}</b></div>`;
  }
  function itemHtml(e, showDate){
    return `<li class="item" data-id="${esc(e.id)}">
      <div class="dot ${e.type}">${e.type==="in"?"＋":"－"}</div>
      <div class="t"><div>${esc(e.cat)}</div><small>${showDate?dateTH(e.date)+" · ":""}${esc(e.pay)}${e.note?" · "+esc(e.note):""}</small></div>
      <div class="a ${e.type}">${e.type==="in"?"+":"-"}${fmt(e.amount)}</div></li>`;
  }

  // ---------- ADD view ----------
  function renderCats(){
    $("#cats").innerHTML = CATS[type].map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  }
  $("#cats").addEventListener("click", e=>{ const b=e.target.closest(".chip"); if(!b) return; cat=b.dataset.c; renderCats(); });
  $("#typeSeg").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; setType(b.dataset.v); });
  function setType(t){
    type=t; [...$("#typeSeg").children].forEach(x=>x.classList.toggle("on",x.dataset.v===t));
    if (!CATS[t].includes(cat)) cat = CATS[t][0];
    renderCats();
    $("#saveBtn").style.background = t==="in"?"var(--in)":"var(--out)";
    $("#saveBtn").textContent = editing ? "บันทึกการแก้ไข" : (t==="in"?"บันทึกรายรับ":"บันทึกรายจ่าย");
  }
  $("#amt").addEventListener("input", e=>{ e.target.value = e.target.value.replace(/[^\d.,]/g,""); });
  $("#saveBtn").addEventListener("click", ()=>{
    const amount = parseFloat(($("#amt").value||"").replace(/,/g,""));
    if (!(amount>0)) { toast("ใส่จำนวนเงินก่อนครับ"); $("#amt").focus(); return; }
    const date = $("#date").value || todayStr();
    const old = editing ? entries[editing] : null;
    const entry = { id: editing || (Date.now().toString(36)+Math.random().toString(36).slice(2,7)),
      date, type, cat, amount, pay: $("#pay").value, note: $("#note").value.trim().slice(0,200),
      ts: old ? old.ts : Date.now() };
    saveEntry(entry, old);
    toast(editing ? "แก้ไขแล้ว" : (type==="in"?"บันทึกรายรับแล้ว":"บันทึกรายจ่ายแล้ว"));
    resetForm();
  });
  function resetForm(){
    editing=null; $("#editbar").classList.remove("on");
    $("#amt").value=""; $("#note").value=""; $("#date").value=todayStr();
    setType(type);
  }
  $("#cancelEdit").addEventListener("click", resetForm);

  function renderToday(){
    const t = todayStr();
    const arr = list().filter(e=>e.date===t).sort((a,b)=>b.ts-a.ts);
    $("#todayTitle").textContent = "วันนี้ · "+dateTH(t);
    $("#todayKpis").innerHTML = kpiHtml(sumOf(arr));
    $("#todayList").innerHTML = arr.length ? arr.map(e=>itemHtml(e,false)).join("") : `<div class="empty">ยังไม่มีรายการวันนี้</div>`;
  }

  // ---------- item sheet ----------
  let sheetItem = null;
  document.addEventListener("click", e=>{
    const li = e.target.closest(".item"); if(!li) return;
    const it = entries[li.dataset.id]; if(!it) return;
    sheetItem = it;
    $("#mTitle").textContent = (it.type==="in"?"รายรับ · ":"รายจ่าย · ")+it.cat;
    $("#mBody").innerHTML = `฿${fmt(it.amount)} · ${dateTH(it.date)} · ${esc(it.pay)}${it.note?"<br>"+esc(it.note):""}`;
    $("#mDel").textContent="ลบรายการนี้"; $("#mDel").dataset.confirm="";
    $("#modal").classList.add("show");
  });
  $("#mClose").addEventListener("click", ()=>$("#modal").classList.remove("show"));
  $("#modal").addEventListener("click", e=>{ if(e.target.id==="modal") $("#modal").classList.remove("show"); });
  $("#mDel").addEventListener("click", ()=>{
    const b=$("#mDel");
    if (!b.dataset.confirm){ b.dataset.confirm="1"; b.textContent="แตะอีกครั้งเพื่อยืนยันการลบ"; return; }
    deleteEntry(sheetItem); $("#modal").classList.remove("show"); toast("ลบแล้ว");
  });
  $("#mEdit").addEventListener("click", ()=>{
    const it=sheetItem; $("#modal").classList.remove("show");
    editing = it.id; type = it.type; cat = it.cat;
    $("#amt").value = it.amount; $("#date").value = it.date; $("#pay").value = it.pay; $("#note").value = it.note||"";
    $("#editbar").classList.add("on"); setType(it.type); go("add"); window.scrollTo({top:0,behavior:"smooth"});
  });

  // ---------- SUMMARY ----------
  $("#periodSeg").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; period=b.dataset.v;
    [...$("#periodSeg").children].forEach(x=>x.classList.toggle("on",x===b)); renderPicker(); renderSummary(); });

  function yearsAvailable(){
    const ys = new Set(list().map(e=>e.date.slice(0,4))); ys.add(todayStr().slice(0,4)); ys.add(selYear);
    return [...ys].sort();
  }
  function renderPicker(){
    const box=$("#pickerBox");
    if (period==="day") box.innerHTML = `<input type="date" id="pDay" value="${selDay}">`;
    else if (period==="month") box.innerHTML = `<input type="month" id="pMonth" value="${selMonth}">`;
    else box.innerHTML = `<select id="pYear">${yearsAvailable().map(y=>`<option value="${y}" ${y===selYear?"selected":""}>พ.ศ. ${be(y)} (${y})</option>`).join("")}</select>`;
    const el = box.firstElementChild;
    el.addEventListener("change", ()=>{ if(!el.value) return;
      if(period==="day"){ selDay=el.value; selMonth=selDay.slice(0,7); selYear=selDay.slice(0,4); }
      else if(period==="month"){ selMonth=el.value; selYear=selMonth.slice(0,4); }
      else selYear=el.value;
      renderSummary(); });
  }

  function catBars(el, arr, color){
    const by = {}; arr.forEach(e=>{ by[e.cat]=(by[e.cat]||0)+e.amount; });
    const rows = Object.entries(by).sort((a,b)=>b[1]-a[1]);
    const tot = rows.reduce((s,r)=>s+r[1],0);
    el.innerHTML = rows.length ? rows.map(([c,v])=>`<div class="b"><div class="l"><span>${esc(c)}</span><span><b>฿${fmt(v)}</b> <span class="muted">${Math.round(v/tot*100)}%</span></span></div>
      <div class="track"><div class="fill" style="width:${(v/rows[0][1]*100).toFixed(1)}%;background:${color}"></div></div></div>`).join("")
      : `<div class="empty">ไม่มีข้อมูล</div>`;
  }

  function renderSummary(){
    const all = list();
    let inPeriod, title, chartTitle, labels=[], keys=[], selKey, keyFn;
    if (period==="day"){
      inPeriod = all.filter(e=>e.date===selDay);
      title = "สรุปวันที่ "+dateTH(selDay);
      const [y,m] = selMonth.split("-").map(Number); const days = new Date(y,m,0).getDate();
      for(let d=1; d<=days; d++){ keys.push(selMonth+"-"+pad(d)); labels.push(String(d)); }
      chartTitle = "รายวัน · "+TH_MF[m-1]+" "+be(y); selKey=selDay; keyFn=e=>e.date;
    } else if (period==="month"){
      inPeriod = all.filter(e=>e.date.slice(0,7)===selMonth);
      const [y,m] = selMonth.split("-").map(Number);
      title = "สรุปเดือน "+TH_MF[m-1]+" "+be(y);
      for(let i=1;i<=12;i++){ keys.push(selYear+"-"+pad(i)); labels.push(TH_M[i-1]); }
      chartTitle = "รายเดือน · ปี "+be(selYear); selKey=selMonth; keyFn=e=>e.date.slice(0,7);
    } else {
      inPeriod = all.filter(e=>e.date.slice(0,4)===selYear);
      title = "สรุปปี พ.ศ. "+be(selYear);
      keys = yearsAvailable(); labels = keys.map(y=>String(be(y)));
      chartTitle = "รายปี"; selKey=selYear; keyFn=e=>e.date.slice(0,4);
    }
    $("#sumTitle").textContent = title;
    $("#sumKpis").innerHTML = kpiHtml(sumOf(inPeriod)) + `<div class="muted" style="grid-column:1/-1">${inPeriod.length} รายการ</div>`;
    $("#chartTitle").textContent = chartTitle;
    catBars($("#catIn"), inPeriod.filter(e=>e.type==="in"), "var(--in)");
    catBars($("#catOut"), inPeriod.filter(e=>e.type==="out"), "var(--out)");

    const inc = keys.map(()=>0), exp = keys.map(()=>0), idx = {}; keys.forEach((k,i)=>idx[k]=i);
    all.forEach(e=>{ const i=idx[keyFn(e)]; if(i===undefined) return; if(e.type==="in") inc[i]+=e.amount; else exp[i]+=e.amount; });
    const net = keys.map((_,i)=>inc[i]-exp[i]);
    chartKeys = keys;
    drawChart(labels, inc, exp, net, keys.indexOf(selKey));
  }

  function drawChart(labels, inc, exp, net, selIdx){
    if (typeof Chart==="undefined"){ $("#chartHint").textContent="โหลดกราฟไม่ได้ (ไม่มีอินเทอร์เน็ต?)"; return; }
    const alpha = (c,i)=> selIdx<0||i===selIdx ? c : c+"66";
    const data = {
      labels,
      datasets:[
        {type:"bar",label:"รายรับ",data:inc,backgroundColor:inc.map((_,i)=>alpha("#2f8a4a",i)),borderRadius:4,order:2},
        {type:"bar",label:"รายจ่าย",data:exp,backgroundColor:exp.map((_,i)=>alpha("#c4532f",i)),borderRadius:4,order:2},
        {type:"line",label:"กำไร",data:net,borderColor:"#1f2a1f",backgroundColor:"#1f2a1f",borderWidth:2,pointRadius:labels.length>15?0:3,tension:.3,order:1}
      ]
    };
    const opts = {
      responsive:true, maintainAspectRatio:false, animation:{duration:250},
      interaction:{mode:"index",intersect:false},
      plugins:{
        legend:{position:"bottom",labels:{boxWidth:10,boxHeight:10,font:{family:"IBM Plex Sans Thai",size:12}}},
        tooltip:{callbacks:{label:c=>" "+c.dataset.label+": ฿"+fmt(c.parsed.y)}, titleFont:{family:"IBM Plex Sans Thai"}, bodyFont:{family:"IBM Plex Sans Thai"}}
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{family:"IBM Plex Sans Thai",size:11},maxRotation:0,autoSkip:true}},
        y:{beginAtZero:true,grid:{color:"#eef1ea"},ticks:{font:{size:11},callback:v=>Math.abs(v)>=1000?(v/1000)+"k":v}}
      },
      onClick:(evt,els)=>{
        if(!els.length) return; const k = chartKeys[els[0].index];
        if (period==="day"){ selDay=k; }
        else if (period==="month"){ selMonth=k; }
        else { selYear=k; }
        renderPicker(); renderSummary();
      }
    };
    if (chart){ chart.data=data; chart.options=opts; chart.update(); }
    else chart = new Chart($("#chart"), {data, options:opts});
  }

  // ---------- LIST ----------
  $("#listMonth").value = selMonth;
  ["#listMonth","#listType"].forEach(s=>$(s).addEventListener("change", renderList));
  $("#listSearch").addEventListener("input", renderList);
  function listFiltered(){
    const m=$("#listMonth").value, t=$("#listType").value, q=$("#listSearch").value.trim().toLowerCase();
    return list().filter(e=>(!m||e.date.slice(0,7)===m) && (t==="all"||e.type===t) &&
      (!q || (e.note||"").toLowerCase().includes(q) || e.cat.toLowerCase().includes(q)))
      .sort((a,b)=> a.date===b.date ? b.ts-a.ts : (a.date<b.date?1:-1));
  }
  function renderList(){
    const arr = listFiltered();
    $("#listKpis").innerHTML = kpiHtml(sumOf(arr));
    if (!arr.length){ $("#listBody").innerHTML = `<div class="empty">ไม่มีรายการ</div>`; return; }
    let html="", cur=null, buf=[];
    const flush=()=>{ if(cur===null) return; const s=sumOf(buf);
      html += `<div class="dayhead"><span>${dateTH(cur)}</span><span>${s.n<0?"-":"+"}฿${fmt(Math.abs(s.n))}</span></div><ul class="list">${buf.map(e=>itemHtml(e,false)).join("")}</ul>`; };
    arr.forEach(e=>{ if(e.date!==cur){ flush(); cur=e.date; buf=[]; } buf.push(e); }); flush();
    $("#listBody").innerHTML = html;
  }
  $("#copyCsv").addEventListener("click", async ()=>{
    const arr = listFiltered().slice().reverse();
    const rows = [["วันที่","ประเภท","หมวด","จำนวนเงิน","ช่องทาง","หมายเหตุ"]]
      .concat(arr.map(e=>[e.date, e.type==="in"?"รายรับ":"รายจ่าย", e.cat, e.amount, e.pay, (e.note||"").replace(/[\t\n]/g," ")]));
    const tsv = rows.map(r=>r.join("\t")).join("\n");
    try{ await navigator.clipboard.writeText(tsv); toast("คัดลอกแล้ว "+arr.length+" รายการ — วางใน Excel/Sheets ได้เลย"); }
    catch(e){ toast("คัดลอกไม่ได้ในหน้านี้"); }
  });

  // ---------- backup / restore ----------
  $("#backupBtn").addEventListener("click", ()=>{
    const blob = new Blob([JSON.stringify({app:"bpgarden-ledger",v:1,exported:new Date().toISOString(),entries:list()},null,1)],{type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "bpgarden-backup-"+todayStr()+".json"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("ดาวน์โหลดไฟล์สำรองแล้ว");
  });
  $("#restoreBtn").addEventListener("click", ()=>$("#restoreFile").click());
  $("#restoreFile").addEventListener("change", async e=>{
    const f = e.target.files[0]; e.target.value=""; if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      const arr = Array.isArray(data) ? data : (data.entries||[]);
      let n=0;
      arr.forEach(x=>{ if(x && x.id && x.date && (x.type==="in"||x.type==="out") && x.amount>0){
        entries[x.id] = {id:String(x.id),date:String(x.date),type:x.type,cat:String(x.cat||"อื่นๆ"),amount:Number(x.amount),pay:String(x.pay||"เงินสด"),note:String(x.note||""),ts:Number(x.ts)||Date.now()}; n++; } });
      saveLocal(); renderAll(); toast("กู้คืนแล้ว "+n+" รายการ");
    }catch(err){ toast("ไฟล์ไม่ถูกต้อง"); }
  });

  // ---------- nav ----------
  function go(v){
    document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on", x.id==="v-"+v));
    document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on", x.dataset.v===v));
    if (v==="sum"){ renderPicker(); renderSummary(); }
    if (v==="list") renderList();
    window.scrollTo(0,0);
  }
  document.querySelector("nav").addEventListener("click", e=>{ const b=e.target.closest("button"); if(b) go(b.dataset.v); });

  function renderAll(){
    renderToday();
    if ($("#v-sum").classList.contains("on")) renderSummary();
    if ($("#v-list").classList.contains("on")) renderList();
  }

  // ---------- boot ----------
  $("#date").value = todayStr();
  setType("in");
  loadLocal(); renderAll();
  initDb().then(()=>{ if(mode==="local") renderAll(); });
})();
</script>
</body>
</html>
